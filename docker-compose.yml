services:
  cathode:
    build:
      context: .
      # Le basePath est baké dans les assets au build : il doit être passé ici,
      # pas seulement dans `environment`. Le retirer sert l'appli à la racine.
      args:
        BASE_PATH: /cathode
    image: cathode:latest
    container_name: cathode
    restart: unless-stopped
    # Exposé uniquement sur la loopback : c'est Caddy qui publie vers l'extérieur.
    ports:
      - "127.0.0.1:3000:3000"
    # Charge TMDB_READ_TOKEN + clés VAPID (VAPID_PUBLIC_KEY/PRIVATE_KEY/SUBJECT)
    # depuis le fichier .env (non versionné).
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - BASE_PATH=/cathode
    volumes:
      # Persiste la base (et ses fichiers WAL) hors du conteneur
      - ./data:/app/data
