services:
  cathode:
    build:
      context: .
      # BASE_PATH vient du fichier .env (vide = appli servie à la racine). Il est
      # baké dans les assets au build : il doit être passé ici, pas seulement
      # dans `environment`.
      args:
        BASE_PATH: "${BASE_PATH:-}"
        # Renseigné par scripts/maj-auto.sh ; vide sinon (version « inconnue »).
        CATHODE_VERSION: "${CATHODE_VERSION:-}"
    image: cathode:latest
    container_name: cathode
    restart: unless-stopped
    # Exposé uniquement sur la loopback : c'est Caddy qui publie vers l'extérieur.
    ports:
      - "127.0.0.1:3000:3000"
    # Charge TMDB_READ_TOKEN + clés VAPID (VAPID_PUBLIC_KEY/PRIVATE_KEY/SUBJECT)
    # depuis le fichier .env (non versionné).
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - BASE_PATH=${BASE_PATH:-}
    volumes:
      # Persiste la base (et ses fichiers WAL) hors du conteneur
      - ./data:/app/data
