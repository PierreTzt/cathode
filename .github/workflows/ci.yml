name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # node:sqlite, utilisé comme pilote de base, exige Node 24.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # Aucun secret n'est nécessaire : toutes les pages sont rendues à la
      # demande, le build n'appelle jamais TMDB.
      - name: Build
        run: npm run build
